<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 결혼합니다</title>
    
    <!-- 카카오톡 공유 썸네일 제목: 하트(♥)로 변경 -->
    <meta property="og:title" content="동재 ♥ 혜령 결혼합니다">
    <meta property="og:description" content="2027년 12월 5일 일요일 낮 2시 40분">
    <meta property="og:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80">
    <meta property="og:url" content="https://jo-dongjae.github.io/wedding/">

    <!-- 격식있는 명조체 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        /* 배경 분위기 수정: 차분하고 고급스러운 뮤트톤 */
        body { 
            background-color: #dfdbd4; 
            font-family: 'Nanum Myeongjo', serif; 
            color: #333; line-height: 1.8; overflow-x: hidden; 
        }
        
        .mobile-container { 
            max-width: 480px; margin: 0 auto; 
            background-color: #f4f3f0; 
            min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); 
        }
        
        /* --- 스크롤 등장 애니메이션 (Fade-up) --- */
        .fade-wrap {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-wrap.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 1. 메인 커버 */
        .main-cover {
            position: relative; height: 100vh; height: 100dvh; text-align: center;
            background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
            background-size: cover; background-position: center; display: flex; flex-direction: column; color: #ffffff;
        }
        .main-cover::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.85) 100%); z-index: 1; 
        }
        
        .cover-text-bottom {
            position: absolute; bottom: 12%; left: 0; width: 100%; z-index: 2;
            text-align: center; letter-spacing: 2px;
        }
        .cover-names { font-size: 2.2rem; font-weight: 700; margin-bottom: 15px; text-shadow: 1px 1px 4px rgba(0,0,0,0.3); }
        .cover-date { font-size: 1rem; font-weight: 400; letter-spacing: 4px; opacity: 0.9; text-shadow: 1px 1px 4px rgba(0,0,0,0.3); }

        /* 2. 공통 섹션 타이틀 */
        .section-title { font-size: 1.3rem; color: #2a2a2a; font-weight: 700; text-align: center; letter-spacing: 3px; }
        .section-subtitle { font-size: 0.8rem; color: #888; text-align: center; letter-spacing: 4px; margin-bottom: 30px; text-transform: uppercase; }

        /* 3. 인사말 */
        .greeting { text-align: center; padding: 80px 20px; background-color: transparent; }
        .greeting-divider { width: 1px; height: 40px; background-color: #b89c7d; margin: 0 auto 25px; }
        .greeting-text { font-size: 1rem; color: #3a3a3a; line-height: 2.2; margin-top: 30px; }
        .parents-divider { width: 40px; height: 1px; background-color: #b89c7d; margin: 45px auto 40px; }
        .parents-info { font-size: 1.15rem; color: #222; font-weight: 700; }
        .parent-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; }
        .relation { font-size: 0.95rem; color: #777; font-weight: 400; margin: 0 5px; }

        /* 4. 갤러리 영역 */
        .gallery { padding: 60px 20px; background-color: #ebe9e4; } 
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 20px; }
        .gallery-item { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; cursor: pointer; filter: grayscale(10%) contrast(95%); }
        .hidden-item { display: none; }
        .btn-more {
            display: block; width: 100%; padding: 14px; margin-top: 20px;
            background-color: transparent; border: 1px solid #bba68d; color: #7a6a57;
            font-size: 0.9rem; font-family: inherit; cursor: pointer; letter-spacing: 1px;
        }
        .btn-more:active { background-color: #dfdbd4; }

        /* 5. 달력 및 D-Day 영역 */
        .calendar-section { padding: 80px 20px; background-color: transparent; text-align: center; }
        .calendar-header { font-size: 1.1rem; color: #333; margin-bottom: 30px; letter-spacing: 2px; }
        .calendar-table { width: 100%; max-width: 300px; margin: 0 auto; border-collapse: collapse; text-align: center; }
        .calendar-table th { padding: 10px; font-weight: 400; color: #888; font-size: 0.85rem; border-bottom: 1px solid #dddcd8; }
        .calendar-table td { padding: 15px 10px; font-size: 1rem; color: #4a4a4a; }
        .calendar-table .sun { color: #c46b6b; } 
        .highlight { 
            display: inline-block; width: 30px; height: 30px; line-height: 30px; 
            background-color: #b89c7d; color: white !important; border-radius: 50%; font-weight: 700; 
        }
        .d-day-container { 
            margin-top: 50px; padding: 30px 10px; border-top: 1px solid #dddcd8; border-bottom: 1px solid #dddcd8; 
        }
        .d-day-text { font-size: 1.1rem; color: #3a3a3a; letter-spacing: 1px; }
        .d-day-highlight { font-size: 1.2rem; color: #a68664; font-weight: 700; margin: 10px 0; display: block; }

        /* 6. 오시는 길 */
        .location { padding: 80px 20px; text-align: center; background-color: #ebe9e4; }
        .venue-info { margin-bottom: 25px; }
        .venue-name { font-size: 1.2rem; font-weight: 700; color: #2a2a2a; margin-bottom: 10px; letter-spacing: 1px; }
        .venue-address { font-size: 0.95rem; color: #5a5a5a; word-break: keep-all; }
        .btn-copy-address {
            margin-top: 12px; padding: 6px 16px; background-color: transparent; border: 1px solid #b89c7d; font-size: 0.8rem; color: #a68664; 
            cursor: pointer; font-family: inherit; transition: all 0.3s;
        }
        .btn-copy-address:active { background-color: #b89c7d; color: #fff; }
        .map-wrapper { width: 100%; height: 280px; margin: 20px 0; overflow: hidden; border: 1px solid #d4d1cc; }
        .map-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
        .btn-map { 
            display: inline-block; padding: 12px 0; width: 48%; font-size: 0.85rem; 
            text-decoration: none; font-family: sans-serif; font-weight: 600; text-align: center;
            border: 1px solid #d4d1cc; background-color: #fbfbfb; color: #444;
        }
        
        /* 7. 마음 전하실 곳 (계좌번호) */
        .account-section { padding: 80px 20px; text-align: center; background-color: transparent; }
        .account-desc { font-size: 0.95rem; color: #666; margin-bottom: 30px; line-height: 1.8; }
        .accordion-wrapper { max-width: 360px; margin: 0 auto; text-align: left; }
        .accordion { margin-bottom: 15px; }
        .accordion-btn {
            width: 100%; padding: 16px 20px; background-color: #ebe9e4; border: none; border-radius: 4px;
            font-size: 1rem; color: #2a2a2a; font-family: inherit; font-weight: 700; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: background-color 0.2s;
        }
        .accordion-btn:active { background-color: #dfdbd4; }
        .accordion-content {
            display: none; padding: 15px 20px; background-color: #fff;
            border: 1px solid #ebe9e4; border-top: none; border-radius: 0 0 4px 4px;
        }
        .accordion-content.show { display: block; }
        .account-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #ddd; }
        .account-item:last-child { border-bottom: none; padding-bottom: 0; }
        .account-info { display: flex; flex-direction: column; gap: 5px; }
        .bank-details { font-size: 0.95rem; color: #333; font-weight: 700; font-family: sans-serif; }
        .account-holder { font-size: 0.85rem; color: #777; }
        .btn-copy-acc {
            padding: 6px 12px; background-color: #fcfcfc; border: 1px solid #b89c7d; border-radius: 4px;
            font-size: 0.8rem; color: #a68664; font-family: inherit; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .btn-copy-acc:active { background-color: #b89c7d; color: #fff; }

        /* 8. 축하 메시지 (방명록) */
        .guestbook-section { padding: 80px 20px; text-align: center; background-color: #ebe9e4; }
        .guestbook-form { max-width: 360px; margin: 0 auto 30px; text-align: left; width: 100%; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; }
        .input-group input { 
            width: 100%; flex: 1; padding: 12px; border: 1px solid #d4d1cc; border-radius: 4px; 
            font-family: inherit; font-size: 0.9rem; outline: none; background-color: #fff;
        }
        .guestbook-form textarea { 
            width: 100%; padding: 12px; border: 1px solid #d4d1cc; border-radius: 4px; 
            font-family: inherit; font-size: 0.95rem; resize: none; margin-bottom: 10px; outline: none; background-color: #fff;
        }
        .btn-submit { 
            width: 100%; padding: 14px; background-color: #b89c7d; color: #fff; 
            border: none; border-radius: 4px; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s;
        }
        .btn-submit:active { background-color: #a68664; }
        
        .guestbook-list { 
            max-width: 360px; margin: 0 auto; text-align: left; 
            max-height: 400px; overflow-y: auto; padding-right: 5px; width: 100%;
        }
        .guest-msg-item { 
            background: #fff; padding: 18px; border-radius: 6px; margin-bottom: 12px; 
            position: relative; border: 1px solid #d4d1cc; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .guest-msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .guest-name { font-weight: 700; color: #333; font-size: 0.95rem; }
        .guest-date { color: #999; font-size: 0.8rem; }
        .guest-text { font-size: 0.95rem; color: #555; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        .btn-delete { 
            position: absolute; top: 15px; right: 15px; background: none; border: none; 
            color: #ccc; cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 0 5px;
        }

        /* 9. 갤러리 모달 */
        .modal {
            display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95); flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content { max-width: 100%; max-height: 80vh; object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 35px; font-weight: 300; cursor: pointer; }
        .modal-prev, .modal-next {
            position: absolute; top: 50%; transform: translateY(-50%);
            color: #fff; font-size: 30px; padding: 15px; cursor: pointer; user-select: none; font-weight: 300;
        }
        .modal-prev { left: 10px; }
        .modal-next { right: 10px; }
    </style>
</head>
<body>

<div class="mobile-container">
    <section class="main-cover">
        <div class="cover-text-bottom">
            <!-- 접속 후 보이는 메인 글씨는 그대로 & 사용 -->
            <h1 class="cover-names">동재 & 혜령</h1>
            <p class="cover-date">2027. 12. 05. SUN 2:40 PM</p>
        </div>
    </section>

    <section class="greeting fade-wrap">
        <div class="greeting-divider"></div>
        <h2 class="section-title">초대합니다</h2>
        <p class="section-subtitle">INVITATION</p>
        <p class="greeting-text">
            서로가 마주 보며 다져온 사랑을<br>
            이제 함께 한 곳을 바라보며 걸어갈 수 있는<br>
            큰 사랑으로 키우고자 합니다.<br><br>
            저희 두 사람이 사랑의 이름으로<br>
            지켜나갈 수 있게 앞날을<br>
            축복해 주시면 감사하겠습니다.
        </p>
        
        <div class="parents-divider"></div>

        <div class="parents-info">
            <div class="parent-row">
                <span>누구 · 누구</span>
                <span class="relation">의 장남</span>
                <span>동재</span>
            </div>
            <div class="parent-row">
                <span>누구 · 누구</span>
                <span class="relation">의 장녀</span>
                <span>혜령</span>
            </div>
        </div>
    </section>

    <section class="gallery fade-wrap" id="gallerySection">
        <h2 class="section-title">우리의 순간들</h2>
        <p class="section-subtitle">GALLERY</p>
        <div class="gallery
