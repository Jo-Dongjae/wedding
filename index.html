<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 결혼합니다</title>
    
    <!-- 카카오톡 미리보기(썸네일 & 문구) 설정 -->
    <meta property="og:title" content="조동재 ♥ 김혜령 결혼합니다">
    <meta property="og:description" content="2027년 11월 14일 일요일 낮 2시 40분">
    <meta property="og:image" content="https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80">
    <meta property="og:url" content="https://jo-dongjae.github.io/wedding/">

    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background-color: #e9e9e9; font-family: 'Nanum Myeongjo', serif; color: #333; line-height: 1.8; overflow-x: hidden; }
        
        .mobile-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        
        .main-cover {
            position: relative; height: 100vh; height: 100dvh; text-align: center;
            background-image: url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
            background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: space-between; color: #ffffff;
        }
        .main-cover::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); z-index: 1; }
        
        .main-content { position: relative; z-index: 2; margin-top: 15vh; }
        .title { font-size: 1rem; letter-spacing: 5px; margin-bottom: 20px; }
        .names { font-size: 2.5rem; font-weight: 700; }
        
        .date-location { position: relative; z-index: 2; margin-bottom: 8vh; font-size: 1.1rem; }

        .greeting { text-align: center; padding: 70px 20px; background-color: #fdfbf7; }
        .section-title { font-size: 1.4rem; color: #d4a373; margin-bottom: 30px; font-weight: 700; }

        .location { padding: 60px 20px; text-align: center; background-color: #ffffff; }
        .venue-info { margin-bottom: 20px; }
        .venue-name { font-size: 1.3rem; font-weight: 700; color: #333; margin-bottom: 8px; }
        .venue-address { font-size: 0.95rem; color: #666; word-break: keep-all; }
        
        .map-wrapper {
            width: 100%;
            height: 280px;
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .map-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-map {
            display: inline-block; padding: 10px 18px; font-size: 0.85rem; border-radius: 6px;
            text-decoration: none; font-family: sans-serif; font-weight: 600;
        }
        .btn-kakao { background-color: #FEE500; color: #000000; }
        .btn-naver { background-color: #03C75A; color: #ffffff; }
    </style>
</head>
<body>

<div class="mobile-container">
    <section class="main-cover">
        <div class="main-content">
            <p class="title">WEDDING INVITATION</p>
            <h1 class="names">조동재 ♥ 김혜령</h1>
        </div>
        
        <div class="date-location">
            <p>2027년 11월 14일 일요일 낮 2시 40분</p>
            <p>상록아트홀</p>
        </div>
    </section>

    <section class="greeting">
        <h2 class="section-title">초대합니다</h2>
        <p>
            서로가 마주 보며 다져온 사랑을<br>
            이제 함께 한 곳을 바라보며 걸어갈 수 있는<br>
            큰 사랑으로 키우고자 합니다.<br><br>
            저희 두 사람이 사랑의 이름으로<br>
            지켜나갈 수 있게 앞날을<br>
            축복해 주시면 감사하겠습니다.
            김혜령 바보ㅎ
        </p>
    </section>

    <section class="location">
        <h2 class="section-title">오시는 길</h2>
        <div class="venue-info">
            <p class="venue-name">상록아트홀</p>
            <p class="venue-address">서울특별시 강남구 언주로 508 (선릉역 5번 출구)</p>
        </div>

        <div class="map-wrapper">
            <iframe 
                src="https://maps.google.com/maps?q=서울특별시%20강남구%20언주로%20508%20상록아트홀&t=&z=16&ie=UTF8&iwloc=&output=embed" 
                width="100%" 
                height="100%" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>

        <div class="map-buttons">
            <a href="https://map.kakao.com/link/to/상록아트홀,37.503939,127.042813" target="_blank" class="btn-map btn-kakao">카카오맵 길찾기</a>
            <a href="https://map.naver.com/v5/search/상록아트홀" target="_blank" class="btn-map btn-naver">네이버지도 길찾기</a>
        </div>
    </section>
</div>

</body>
</html>
